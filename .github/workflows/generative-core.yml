name: Generate Design Core

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    name: build-and-commit-design-core
    permissions:
      contents: write # Crucial: Allows the bot to commit the new image
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install Pillow requests

      - name: Run generative script
        run: python generate_core.py

      - name: Commit and push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          # Commits only if the generated image is actually different
          git diff-index --quiet HEAD || git commit -m "Generated new core visualization"
          git push
